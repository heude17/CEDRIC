{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Nouveau projet{% endblock %}
{% block content %}
    <h1 class="text-xl font-bold mb-4">Nouveau projet — {{ client.nom }}</h1>
    <form method="post" class="bg-white rounded-lg shadow-sm border border-slate-200 p-4">
        {{ form.hidden_tag() }}
        {{ field(form.nom) }}
        {{ field(form.adresse_chantier) }}
        {{ field(form.notes) }}
        <button type="submit"
                class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-white font-medium px-5 py-2.5 rounded-md transition">
            Enregistrer le projet
        </button>
    </form>
{% endblock %}
