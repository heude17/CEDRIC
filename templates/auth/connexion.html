{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Connexion{% endblock %}
{% block content %}
    <h1 class="text-xl font-bold mb-4">Connexion technicien</h1>
    <form method="post" class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 max-w-sm mx-auto">
        {{ form.hidden_tag() }}
        {{ field(form.email) }}
        {{ field(form.password) }}
        <button type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-white font-medium px-5 py-2.5 rounded-md transition">
            Se connecter
        </button>
    </form>
{% endblock %}
