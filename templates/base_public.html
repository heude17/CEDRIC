<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Validation de l'audit{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white">
        <div class="max-w-3xl mx-auto px-4 py-3">
            <span class="text-lg font-semibold tracking-tight">🔧 Audit Domotique</span>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="space-y-2 mb-4">
                    {% for category, message in messages %}
                        <div class="rounded-md px-4 py-3 text-sm font-medium
                            {% if category == 'success' %} bg-emerald-100 text-emerald-800 border border-emerald-200
                            {% else %} bg-amber-100 text-amber-800 border border-amber-200 {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-xs text-slate-400 py-4">
        Module d'Audit Domotique
    </footer>

    <script src="{{ url_for('static', filename='js/voice-dictation.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
